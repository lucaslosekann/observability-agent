novvs_postgres:
  query: |
    SELECT
      count(*)::bigint AS connections,
      count(*) FILTER (WHERE state = 'active')::bigint AS active_connections,
      count(*) FILTER (WHERE state = 'idle')::bigint AS idle_connections,
      count(*) FILTER (
        WHERE xact_start IS NOT NULL
          AND state <> 'idle'
          AND clock_timestamp() - xact_start >= interval '5 minutes'
      )::bigint AS long_transactions,
      COALESCE(
        extract(epoch FROM (
          max(clock_timestamp() - xact_start)
            FILTER (WHERE xact_start IS NOT NULL AND state <> 'idle')
        )),
        0
      )::double precision AS oldest_transaction_seconds,
      count(*) FILTER (
        WHERE cardinality(pg_blocking_pids(pid)) > 0
      )::bigint AS blocked_sessions,
      pg_database_size(current_database())::bigint AS database_size_bytes,
      COALESCE((
        SELECT xact_commit
        FROM pg_stat_database
        WHERE datname = current_database()
      ), 0)::bigint AS commits_total,
      COALESCE((
        SELECT xact_rollback
        FROM pg_stat_database
        WHERE datname = current_database()
      ), 0)::bigint AS rollbacks_total
    FROM pg_stat_activity
    WHERE datname = current_database()
      AND pid <> pg_backend_pid();
  metrics:
    - connections:
        usage: GAUGE
        description: Total de conexoes na base monitorada.
    - active_connections:
        usage: GAUGE
        description: Conexoes PostgreSQL no estado active.
    - idle_connections:
        usage: GAUGE
        description: Conexoes PostgreSQL no estado idle.
    - long_transactions:
        usage: GAUGE
        description: Transacoes abertas ha pelo menos cinco minutos.
    - oldest_transaction_seconds:
        usage: GAUGE
        description: Idade em segundos da transacao aberta mais antiga.
    - blocked_sessions:
        usage: GAUGE
        description: Sessoes bloqueadas por outra sessao.
    - database_size_bytes:
        usage: GAUGE
        description: Tamanho da base monitorada em bytes.
    - commits_total:
        usage: COUNTER
        description: Total de commits na base monitorada.
    - rollbacks_total:
        usage: COUNTER
        description: Total de rollbacks na base monitorada.
